server.port=8080
spring.application.name=apigateway

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# ==========================================
# AUTH SERVICE ROUTE
# ==========================================
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**

# ==========================================
# USER SERVICE ROUTE
# ==========================================
spring.cloud.gateway.routes[1].id=userservice
spring.cloud.gateway.routes[1].uri=lb://USERSERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/users/**

# ==========================================
# BOOK SERVICE ROUTE
# ==========================================
spring.cloud.gateway.routes[2].id=bookservice
spring.cloud.gateway.routes[2].uri=lb://BOOKSERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/books/**

# ==========================================
# LOAN SERVICE ROUTE
# ==========================================
spring.cloud.gateway.routes[3].id=loanservice
spring.cloud.gateway.routes[3].uri=lb://LOANSERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/loans/**

# ==========================================
# FINE SERVICE ROUTE
# ==========================================
spring.cloud.gateway.routes[4].id=fine-service
spring.cloud.gateway.routes[4].uri=lb://FINE-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/fines/**

# ==========================================
# GLOBAL CORS CONFIGURATION
# ==========================================
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true