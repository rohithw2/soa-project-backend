spring.application.name=auth-service
server.port=${AUTH_SERVICE_PORT:8081}

# --- Database ---
spring.datasource.url=${AUTH_DB_URL:${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:Project}}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:9666}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- JWT ---
jwt.secret=${JWT_SECRET:bibliotechSuperSecretKeyForJWT2026ChangeThisBeforeSubmission}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# --- Eureka ---
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
