spring.application.name=loanservice
server.port=${LOAN_SERVICE_PORT:8084}

# --- Database ---
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:Project}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:9666}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- JWT ---
jwt.secret=${JWT_SECRET:bibliotechSuperSecretKeyForJWT2026ChangeThisBeforeSubmission}

# --- Loan & Fine Rules ---
fine.loan-period-days=14
fine.rate-per-day=5.0
loan.overdue-check-cron=0 0 * * * ?

# --- Eureka ---
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
